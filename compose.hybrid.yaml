# Default deployment on the target RTX 3080. Omit this file with -f compose.yaml for CPU-only.
services:
  nemo:
    image: nemotron-speech-hybrid:local
    build:
      args:
        ENABLE_CUDA: 'ON'
        CUDA_ARCH: '86'
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command: ['serve', '--config', '/runtime/hybrid.yaml', '--asr.salm.n_cpu_moe', '${NEMO_CPU_MOE_LAYERS:-48}', '--asr.backend.threads', '${NEMO_CPU_THREADS:-12}', '--host', '0.0.0.0', '--port', '8080', '--read-timeout', '3600', '--write-timeout', '3600', '--no-ui']
  web:
    environment:
      NEMO_MODE: hybrid
  worker:
    environment:
      NEMO_MODE: hybrid
      NEMO_PATCH_COMMIT: b6be7429c18866dd8acd3c9e74296d791e7f084c
  monitor:
    gpus: all
    environment:
      NEMO_MODE: hybrid
      NEMO_CPU_MOE_LAYERS: ${NEMO_CPU_MOE_LAYERS:-48}
      NEMO_PATCH_COMMIT: b6be7429c18866dd8acd3c9e74296d791e7f084c
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility

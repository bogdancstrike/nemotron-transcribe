# Tested local development image. Packaging uses the same pinned source/patch.
services:
  nemo:
    image: nemotron-speech-hybrid:local
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    build:
      args:
        ENABLE_CUDA: 'ON'
        CUDA_ARCH: '86'
    command: ['serve', '--config', '/runtime/hybrid.yaml', '--asr.salm.n_cpu_moe', '${NEMO_CPU_MOE_LAYERS:-48}', '--asr.backend.threads', '${NEMO_CPU_THREADS:-12}', '--host', '0.0.0.0', '--port', '8080', '--read-timeout', '3600', '--write-timeout', '3600', '--no-ui']
  web:
    environment:
      NEMO_MODE: hybrid
  worker:
    environment:
      NEMO_MODE: hybrid
  monitor:
    gpus: all
    environment:
      NEMO_MODE: hybrid
      NEMO_CPU_MOE_LAYERS: ${NEMO_CPU_MOE_LAYERS:-48}
      NEMO_PATCH_COMMIT: 0f3c7f087aec9b1e496d2b4d784ad76a7cd2f2e0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
